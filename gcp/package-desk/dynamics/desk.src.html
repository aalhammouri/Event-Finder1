<title>GCP Package Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&family=Source+Sans+3:wght@400;600;700&family=Source+Code+Pro:wght@500&display=swap">
<style>
/* Layout: app bar, package queue on the left, the selected event lead on the right (header, stage path, quick actions, tabbed cards). */
:root {
  --primary: #214292; --primary-2: #2a4fa8; --primary-fg: #ffffff;
  --link: #214292; --orange: #f5a01c; --orange-ink: #9a5b00; --orange-soft: #fdf3e1;
  --bg: #f7f8fb; --surface: #ffffff; --surface-2: #f7f8fb; --line: #dde2ec; --line-strong: #c3cbdb;
  --fg: #1b2433; --muted: #5a6478; --faint: #8a93a6;
  --band: #214292; --band-2: #1a3678; --band-fg: #ffffff; --band-muted: #d3dcf3;
  --crit: #b3261e; --crit-bg: #fbe9e7; --warn: #9a5b00; --warn-bg: #fdf3e1;
  --ok: #1e6b3a; --ok-bg: #e6f2ea; --info: #214292; --info-bg: #e8edf8;
  --shadow: 0 1px 2px rgba(27, 36, 51, .06), 0 6px 16px rgba(27, 36, 51, .06);
  --f-ui: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-display: Cinzel, "Trajan Pro", Georgia, serif;
  --f-mono: "Source Code Pro", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 4px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --primary: #214292; --primary-2: #2a4fa8; --primary-fg: #ffffff;
  --link: #8fa8e6; --orange: #f5a01c; --orange-ink: #f5a01c; --orange-soft: #3a2a0e;
  --bg: #10151f; --surface: #182030; --surface-2: #1d2738; --line: #2b3548; --line-strong: #3a4660;
  --fg: #e9ecf3; --muted: #9aa3b5; --faint: #78819a;
  --band: #214292; --band-2: #1a3678; --band-fg: #ffffff; --band-muted: #c9d4f2;
  --crit: #f2b8b5; --crit-bg: #3b1916; --warn: #f5a01c; --warn-bg: #3a2a0e;
  --ok: #8fd6a4; --ok-bg: #12301f; --info: #8fa8e6; --info-bg: #22325c;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --primary: #214292; --primary-2: #2a4fa8; --primary-fg: #ffffff;
  --link: #8fa8e6; --orange: #f5a01c; --orange-ink: #f5a01c; --orange-soft: #3a2a0e;
  --bg: #10151f; --surface: #182030; --surface-2: #1d2738; --line: #2b3548; --line-strong: #3a4660;
  --fg: #e9ecf3; --muted: #9aa3b5; --faint: #78819a;
  --band: #214292; --band-2: #1a3678; --band-fg: #ffffff; --band-muted: #c9d4f2;
  --crit: #f2b8b5; --crit-bg: #3b1916; --warn: #f5a01c; --warn-bg: #3a2a0e;
  --ok: #8fd6a4; --ok-bg: #12301f; --info: #8fa8e6; --info-bg: #22325c;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-ui); margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--link); }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: 12.5px; }
.ico { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* App bar */
.appbar { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.logo-plate { display: flex; align-items: center; background: #ffffff; border-radius: 2px; padding: 4px 8px; }
.logo-plate img { height: 40px; width: auto; display: block; }
.appbar .divider { width: 1px; align-self: stretch; background: var(--line); }
.app-name { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.app-name b { font-family: var(--f-display); font-weight: 600; font-size: 16px; letter-spacing: .02em; color: var(--link); }
.app-name span { font-size: 12px; color: var(--muted); }
.appbar .spacer { flex: 1; }
.env-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--orange-ink); background: var(--orange-soft); border: 1px solid color-mix(in srgb, var(--orange) 45%, transparent); padding: 4px 10px; border-radius: 2px; white-space: nowrap; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: var(--primary-fg); font-weight: 600; font-size: 13px; flex: none; }

/* Shell */
.shell { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: calc(100% - 61px); }
.queue { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.queue-head { padding: 16px 16px 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.queue-head h2 { margin: 0; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 4px; padding: 6px 10px; background: var(--surface-2); color: var(--muted); }
.search input { border: 0; background: transparent; outline: none; width: 100%; color: var(--fg); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 2px; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.queue-list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
.q-item { display: grid; grid-template-columns: 4px minmax(0,1fr) auto; gap: 10px; padding: 10px 10px 10px 0; border-radius: 4px; cursor: pointer; border: 1px solid transparent; }
.q-item:hover { background: var(--surface-2); }
.q-item[aria-current="true"] { background: var(--info-bg); border-color: color-mix(in srgb, var(--primary) 30%, transparent); }
.q-item .stripe { border-radius: 4px; background: var(--line); }
.q-item.crit .stripe { background: var(--crit); }
.q-item.warn .stripe { background: var(--orange); }
.q-item.closed { opacity: .55; }
.q-title { font-weight: 600; font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.q-org { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-meta { display: flex; gap: 6px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
.q-right { text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }
.q-empty { padding: 24px 16px; color: var(--muted); font-size: 13px; }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 2px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.crit { background: var(--crit-bg); color: var(--crit); border-color: transparent; }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.chip.info { background: var(--info-bg); color: var(--info); border-color: transparent; }

/* Record */
.record { padding: 20px 24px 40px; display: grid; gap: 16px; min-width: 0; align-content: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.rec-head { padding: 18px 20px 14px; display: grid; gap: 14px; }
.rec-top { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.venue-badge { width: 56px; height: 56px; border-radius: 50%; background: var(--band); color: var(--orange); display: grid; place-items: center; flex: none; }
.venue-badge .ico { width: 26px; height: 26px; stroke-width: 1.6; }
.rec-title { flex: 1; min-width: 240px; }
.rec-title h1 { font-family: var(--f-display); font-weight: 500; font-size: 26px; letter-spacing: .01em; line-height: 1.1; margin: 0 0 4px; text-wrap: balance; }
.rec-sub { color: var(--muted); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.kpis { display: flex; gap: 8px; flex-wrap: wrap; }
.kpi { border: 1px solid var(--line); border-top: 2px solid var(--orange); border-radius: 4px; padding: 8px 12px; min-width: 104px; background: var(--surface-2); }
.kpi b { display: block; font-size: 20px; line-height: 1.15; }
.kpi span { font-size: 11.5px; color: var(--muted); }
.kpi.crit { background: var(--crit-bg); border-color: transparent; } .kpi.crit b { color: var(--crit); }
.kpi.warn { background: var(--warn-bg); border-color: transparent; } .kpi.warn b { color: var(--warn); }
.meta-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 20px; padding-top: 12px; border-top: 1px solid var(--line); }
.meta-row div { min-width: 0; }
.meta-row label { display: block; font-size: 11.5px; color: var(--muted); letter-spacing: .02em; }
.meta-row span { font-weight: 500; display: flex; gap: 6px; align-items: center; overflow-wrap: anywhere; }

/* Stage path */
.path { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.step { position: relative; padding: 10px 8px 10px 22px; font-size: 12px; color: var(--muted); line-height: 1.25; min-height: 52px; display: flex; flex-direction: column; justify-content: center; }
.step b { font-weight: 600; color: inherit; }
.step::after { content: ""; position: absolute; right: -9px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%) rotate(45deg); border-top: 1px solid var(--line-strong); border-right: 1px solid var(--line-strong); background: inherit; z-index: 1; }
.step:last-child::after { display: none; }
.step.done { background: color-mix(in srgb, var(--primary) 12%, var(--surface-2)); color: var(--fg); }
.step.done b::before { content: "✓ "; color: var(--ok); }
.step.current { background: var(--band); color: var(--band-fg); }
.step.current::after { border-color: var(--band); }
.step.current small { color: var(--band-muted); }
.step small { font-size: 11px; }

/* Command bar */
.cmdbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 12px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); padding: 7px 12px; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 13px; color: var(--fg); text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.btn.primary:hover { background: var(--primary-2); }
.btn.accent { background: var(--orange); border-color: var(--orange); color: #1b2433; }
.btn.danger { color: var(--crit); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.cmdbar .sep { width: 1px; height: 24px; background: var(--line); }
.menu-wrap { position: relative; }
.menu { position: absolute; top: calc(100% + 4px); left: 0; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 4px; box-shadow: var(--shadow); padding: 4px; min-width: 240px; z-index: 30; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.menu button:hover { background: var(--surface-2); }
.menu small { display: block; color: var(--muted); font-size: 11.5px; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 10px 14px; cursor: pointer; color: var(--muted); font-weight: 500; border-bottom: 3px solid transparent; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--orange); font-weight: 600; }
.tabs .count { background: var(--crit-bg); color: var(--crit); border-radius: 2px; font-size: 11px; padding: 0 7px; font-weight: 700; }

.grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.col { display: grid; gap: 16px; min-width: 0; }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0; }
.card-h { border-bottom: 1px solid var(--line); padding-bottom: 10px; position: relative; }
.card-h::after { content: ""; position: absolute; left: 16px; bottom: -1px; width: 40px; height: 2px; background: var(--orange); }
.card-h h3 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; }
.card-b { padding: 12px 16px 16px; }
.hint { color: var(--muted); font-size: 12.5px; }

/* Event band */
.band { background: linear-gradient(135deg, var(--band) 0%, var(--band-2) 100%); color: var(--band-fg); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 12px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.band::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; border: 28px solid color-mix(in srgb, var(--orange) 22%, transparent); pointer-events: none; }
.band .eyebrow { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--orange); font-weight: 700; }
.band h2 { font-family: var(--f-display); font-weight: 500; font-size: 24px; letter-spacing: .01em; margin: 0; line-height: 1.15; text-wrap: balance; position: relative; z-index: 1; }
.band-meta { display: flex; gap: 18px; flex-wrap: wrap; color: var(--band-muted); font-size: 13px; position: relative; z-index: 1; }
.band-meta span { display: inline-flex; gap: 6px; align-items: center; }
.auction-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; position: relative; z-index: 1; }
.au { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-radius: 4px; padding: 8px 10px; }
.au label { display: block; font-size: 11px; color: var(--band-muted); }
.au b { font-size: 14px; }
.au.yes b { color: #9ef0bf; } .au.no b { color: #ffb3a8; } .au.unclear b { color: #ffd38a; }
.band-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; position: relative; z-index: 1; }
.band .btn { background: transparent; color: var(--band-fg); border-color: rgba(255,255,255,.4); }
.band .btn:hover { background: rgba(255,255,255,.1); }
.evid { font-size: 12px; padding: 3px 10px; border-radius: 2px; font-weight: 600; }
.evid { border-radius: 2px; }
.evid.Confirmed { background: #d8f5e4; color: #11532f; } .evid.Assumed { background: #ffe9c2; color: #6b4000; } .evid.Unverified { background: #ffd9d3; color: #7a1e12; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; }
.tile { padding: 12px 14px; border-right: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
.tile:last-child { border-right: 0; }
.tile .ico { width: 22px; height: 22px; color: var(--link); margin-top: 2px; }
.tile b { display: block; font-size: 19px; line-height: 1.2; }
.tile span { display: block; font-size: 12px; color: var(--muted); }
.tile small { display: block; font-size: 11px; color: var(--faint); }
.meter { display: flex; gap: 2px; margin-top: 4px; }
.meter i { width: 10px; height: 5px; border-radius: 2px; background: var(--line); }
.meter i.on { background: var(--orange); }

/* Org & contact */
.org-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.kv { display: grid; gap: 8px; }
.kv div { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.kv label { font-size: 12px; color: var(--muted); }
.kv span { overflow-wrap: anywhere; }
.label-card { font-family: var(--f-mono); font-size: 12.5px; line-height: 1.6; background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: 4px; padding: 10px 12px; text-transform: uppercase; white-space: pre-line; }
.person { display: flex; gap: 12px; align-items: flex-start; }
.person .avatar { background: var(--surface-2); color: var(--link); border: 1px solid var(--line-strong); }
.line-act { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
.line-act:last-child { border-bottom: 0; }
.line-act > span { display: inline-flex; gap: 8px; align-items: center; min-width: 0; overflow-wrap: anywhere; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px; cursor: pointer; color: var(--muted); display: inline-grid; place-items: center; }
.icon-btn:hover { color: var(--fg); background: var(--surface-2); }

/* Action items */
.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.todo li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); align-items: start; }
.todo li:last-child { border-bottom: 0; }
.todo .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; justify-self: center; }
.todo .crit .dot, .todo li.crit .dot { background: var(--crit); }
.todo li.warn .dot { background: var(--orange); }
.todo li.info .dot { background: var(--info); }
.todo li.done { opacity: .5; } .todo li.done .t { text-decoration: line-through; }
.todo .t { font-weight: 500; font-size: 13px; }
.todo .d { font-size: 12px; color: var(--muted); }
.todo .acts { display: flex; gap: 4px; }
.allclear { display: flex; gap: 10px; align-items: center; color: var(--ok); font-weight: 500; padding: 8px 0; }

select.field, textarea.field { width: 100%; border: 1px solid var(--line-strong); border-radius: 4px; padding: 8px 10px; background: var(--surface); }
textarea.field { min-height: 72px; resize: vertical; }
.field-label { font-size: 12px; color: var(--muted); display: block; margin: 10px 0 4px; }

/* Timeline */
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.tl li { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 10px; }
.tl .tl-ico { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); color: var(--link); }
.tl .tl-ico .ico { width: 14px; height: 14px; }
.tl b { font-weight: 500; font-size: 13px; display: block; }
.tl span { font-size: 12px; color: var(--muted); }

/* Tables */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
.slot { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
.slot i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

/* Merge gate */
.norm { display: grid; grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr); gap: 8px; align-items: center; }
.norm .box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; min-width: 0; overflow-wrap: anywhere; }
.norm .box label { display: block; font-size: 11px; color: var(--muted); font-family: var(--f-ui); }
.match { border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; display: grid; gap: 6px; }
.match.strong { border-color: color-mix(in srgb, var(--ok) 50%, transparent); background: color-mix(in srgb, var(--ok-bg) 60%, var(--surface)); }
.match.soft { border-color: color-mix(in srgb, var(--orange) 50%, transparent); background: color-mix(in srgb, var(--warn-bg) 60%, var(--surface)); }
.match-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.match-h b { flex: 1; min-width: 160px; }
.stack { display: grid; gap: 10px; }
.decision { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

.ladder { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.ladder li { display: grid; grid-template-columns: 22px minmax(0,1fr) auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: center; }
.ladder li:last-child { border-bottom: 0; }
.ladder .ring { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-strong); justify-self: center; }
.ladder li.on .ring { border-color: var(--ok); background: var(--ok); }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 4px; font-size: 13px; box-shadow: var(--shadow); z-index: 50; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); }
.toast button { background: transparent; border: 0; color: var(--orange); font-weight: 700; cursor: pointer; }

const DAY = 86400000;

// ---------- matching ----------
function matchesFor(L) {
  const out = [];
  for (const A of S.accounts) {
    if (L.einN && A.ein && L.einN === A.ein) out.push({kind:'account', strength:'strong', reason:'Same EIN', A});
    else if (L.key && A.key === L.key) out.push({kind:'account', strength:'strong', reason:'Same address key', A});
  }
  for (const O of LEADS) {
    if (O.id === L.id) continue;
    let reason = null, strength = null;
    if (L.einN && O.einN && L.einN === O.einN) { reason = 'Same EIN'; strength = 'strong'; }
    else if (L.key && O.key === L.key) { reason = 'Same address key'; strength = 'strong'; }
    else if (L.nameN && O.nameN === L.nameN) { reason = 'Same name, different address'; strength = 'soft'; }
    if (reason) out.push({kind:'lead', strength, reason, O});
  }
  return out;
}

// ---------- action items ----------
function flags(L) {
  const s = st(L.id), out = [], open = !s.outcome || s.outcome === 714000020;
  if (!open) return out;
  const dm = days(L.mby), de = days(L.evd);
  if (s.stage < 714000015) {
    if (de < 0) out.push({id:'past', sev:'crit', t:'Event date has passed', d:`The event was ${fmt(L.evd)}. Record the outcome as Missed Event.`, act:'missed'});
    else if (dm < 0) out.push({id:'late', sev:'crit', t:`Mail-by date passed ${-dm} day${dm===-1?'':'s'} ago`, d:`Event is in ${de} days (${fmt(L.evd)}). Mail now if the charity can still use it, or record Missed Event.`, act:'missed'});
    else if (dm <= 7) out.push({id:'soon', sev:'warn', t:`Mail by ${fmt(L.mby)} (${dm === 0 ? 'today' : dm + ' days'})`, d:'This package needs to move this week.'});
  }
  if (s.stage === 714000010) out.push({id:'review', sev:'info', t:'Review the event and choose an outcome', d:'Approve to send it to Matt for merge, or record why not.', act:'review'});
  if (s.stage === 714000011) out.push({id:'merge', sev:'warn', t:'Merge with a charity account', d:'Link to an existing charity or create one. Matches are on the Merge gate tab.', act:'merge'});
  const ms = matchesFor(L).filter(m => m.kind === 'lead' && m.strength === 'strong');
  if (ms.length) out.push({id:'dup', sev:'warn', t:`Same charity as ${ms.length} other lead${ms.length>1?'s':''}`, d: ms.map(m => m.O.ev).join('; ') + '. Merge both to one account and decide whether one package covers both events.', act:'merge'});
  const assumedBad = L.evid === 'Assumed' && [0,1,3].some(i => L.au[i] === 'Y');
  if (assumedBad) out.push({id:'evid', sev:'crit', t:'Auction values break scan rule 5A', d:`${[0,1,3].filter(i => L.au[i]==='Y').map(i => AU_NAMES[i]).join(' and ')} set to Yes on Assumed evidence. Only Silent auction may be assumed. Check the event page before mailing.`, link:L.evweb});
  if (L.au.includes('U')) out.push({id:'unclear', sev:'info', t:`${L.au.map((v,i)=>v==='U'?AU_NAMES[i]:null).filter(Boolean).join(', ')} is Unclear`, d:'The weekly scan revisits this within 120 days of the event.'});
  if (/\bP\.?\s*O\.?\s*BOX\b/i.test(L.line)) out.push({id:'pobox', sev:'warn', t:'Mailing address is a PO Box', d:'UPS and FedEx cannot deliver to PO Boxes. Ship by USPS or find a street address.'});
  if (!L.einN) out.push({id:'ein', sev:'info', t:'No EIN on file', d:'Find it in the IRS Texas extract or Candid. EIN is the strongest merge key.'});
  out.push({id:'verify', sev:'info', t:'Mailing address not verified', d:`Source: ${L.src || 'not recorded'}. Confirm before printing the label.`});
  out.push({id:'deadline', sev:'info', t:'Charity donation deadline not recorded', d:'Mail-by is the 21-day assumption. Use the charity’s own "donation needed by" date when it publishes one.'});
  if (!L.fn) out.push({id:'contact', sev:'warn', t:'Contact is a team, not a person', d:`${L.ln}. Find a named person at ${L.org} for the package and follow-up.`});
  else {
    const local = (L.em1 || '').split('@')[0].toLowerCase().replace(/[^a-z]/g,'');
    if (local && !GENERIC_MAIL.test(local) && !local.includes(L.fn.toLowerCase().slice(0,3)) && !local.includes(L.ln.toLowerCase().slice(0,4)))

  }
  if (!L.title) out.push({id:'title', sev:'info', t:'Contact title missing', d:'Needed for the cover letter salutation.'});
  if (!L.ph1 && !L.ph2) out.push({id:'phone', sev:'info', t:'No phone number on file', d:'Delivery confirmation calls need one.'});
  return out;
}

// ---------- render: queue ----------
function renderQueue() {
  const q = S.q.trim().toLowerCase();
  let list = LEADS.filter(L => !q || (L.ev + ' ' + L.org + ' ' + L.city).toLowerCase().includes(q));
  const f = S.filter;
  list = list.filter(L => {
    const closed = isClosed(L), mailed = st(L.id).stage === 714000015;
    if (f === 'closed') return closed;
    if (closed) return false;
    if (f === 'overdue') return !mailed && days(L.mby) < 0;
    if (f === 'soon') return !mailed && days(L.mby) >= 0 && days(L.mby) <= 14;
    if (f === 'attention') return urgency(L) === 'crit';
    return true;
  });
  document.getElementById('q-count').textContent = `${list.length} of ${LEADS.length}`;
  document.querySelectorAll('#q-filter button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === f)));
  const ul = document.getElementById('q-list');
  if (!list.length) { ul.innerHTML = `<li class="q-empty">No events match this filter.</li>`; return; }
  ul.innerHTML = list.map(L => {
    const u = urgency(L), closed = isClosed(L), s = st(L.id);
    return `<li class="q-item ${closed ? 'closed' : u}" data-id="${L.id}" tabindex="0" aria-current="${L.id === S.sel}">

            <div><label>Website</label><span><a href="${esc(L.web)}" target="_blank" rel="noopener">${esc(host(L.web))}</a></span></div>
            <div><label>EIN</label><span class="mono">${L.ein ? esc(L.ein) : '<span class="hint">Not on file</span>'}</span></div>
            <div><label>Address source</label><span>${esc(L.src || 'Not recorded')}</span></div>
          </div>
          <div><span class="field-label">Mailing label</span><div class="label-card">${esc(labelText(L))}</div></div>
        </div>
        <div class="stack">
          <div class="person"><div class="avatar">${esc((L.fn ? L.fn[0] : '') + (L.ln ? L.ln[0] : ''))}</div><div style="min-width:0"><b>${esc(L.person)}</b><div class="hint">${esc(L.title || 'Title not recorded')}</div><div class="hint">Primary charity contact</div></div></div>
          <div>
            ${[[L.em1,'i-mail','E-mail'],[L.em2 !== L.em1 ? L.em2 : null,'i-mail','Org e-mail'],[L.ph1,'i-phone','Phone'],[L.ph2 !== L.ph1 ? L.ph2 : null,'i-phone','Org phone']].filter(x => x[0]).map(([v, i, w]) =>
              `<div class="line-act"><span>${ico(i)}<span><span class="hint">${w}</span><br>${esc(v)}</span></span><button class="icon-btn" data-copytext="${esc(v)}" data-what="${w}" aria-label="Copy ${w}">${ico('i-copy')}</button></div>`).join('') || '<p class="hint">No e-mail or phone on file.</p>'}
          </div>
        </div>
      </div>
    </section>
  </div>

  <div class="col">
    <section class="card">
      <div class="card-h">${ico('i-alert')}<h3>Action items</h3><span class="chip num">${fl.length} open</span></div>
      <div class="card-b">
        ${all.length ? `<ul class="todo">${all.map(f => {
          const done = !!s.done[f.id];
          const btn = f.act === 'missed' ? `<button class="btn sm" data-reject="714000023">Missed</button>`
            : f.act === 'review' ? `<button class="btn sm" data-focus="review">Review</button>`
            : f.act === 'merge' ? `<button class="btn sm" data-tab="merge">Open</button>`
            : f.link ? `<a class="btn sm" href="${esc(f.link)}" target="_blank" rel="noopener">Check</a>` : '';
          return `<li class="${f.sev} ${done ? 'done' : ''}"><span class="dot"></span><div style="min-width:0"><div class="t">${esc(f.t)}</div><div class="d">${esc(f.d)}</div></div>
            <div class="acts">${done ? '' : btn}<button class="icon-btn" data-done="${f.id}" aria-label="${done ? 'Mark not done' : 'Mark done'}" title="${done ? 'Mark not done' : 'Mark done'}">${ico(done ? 'i-undo' : 'i-check')}</button></div></li>`;
        }).join('')}</ul>` : `<div class="allclear">${ico('i-check')}Nothing needs attention on this lead.</div>`}
      </div>
    </section>

    <section class="card" id="review-card">
      <div class="card-h">${ico('i-check')}<h3>Review outcome</h3></div>
      <div class="card-b">
        <label class="field-label" for="outcome">Outcome</label>
        <select class="field" id="outcome" ${s.stage >= 714000012 ? 'disabled' : ''}>
          <option value="">Not decided</option>
          ${Object.entries(OUTCOMES).map(([v, n]) => `<option value="${v}" ${s.outcome == v ? 'selected' : ''}>${n}</option>`).join('')}
        </select>
        <label class="field-label" for="notes">Review notes</label>
        <textarea class="field" id="notes" placeholder="Why this event, anything the merge or print step should know">${esc(s.notes)}</textarea>
      </div>
    </section>

    <section class="card">
      <div class="card-h">${ico('i-clock')}<h3>Timeline</h3></div>
      <div class="card-b"><ul class="tl">
        ${s.log.map(e => `<li><span class="tl-ico">${ico(e.icon)}</span><div><b>${esc(e.text)}</b><span>${esc(e.t)} · this preview</span></div></li>`).join('')}
        <li><span class="tl-ico">${ico('i-sync')}</span><div><b>Lead updated in Dynamics</b><span>Oct 2, 2026, 3:51 PM · Matt Goff (connector)</span></div></li>
        <li><span class="tl-ico">${ico('i-sync')}</span><div><b>Lead created from the weekly scan</b><span>Sep 30, 2026, ${esc(L.c)} · synced from Airtable</span></div></li>
      </ul></div>
    </section>
  </div></div>`;
}

function mergeTab(L) {
  const s = st(L.id), ms = matchesFor(L);
  const accs = ms.filter(m => m.kind === 'account'), leads = ms.filter(m => m.kind === 'lead');
  const canMerge = s.stage === 714000011 && !isClosed(L);
  const merged = s.account ? S.accounts.find(a => a.id === s.account) : null;
  const status = merged ? `<span class="chip ok">${ico('i-check')}Linked to ${esc(merged.name)}</span>`
    : canMerge ? `<span class="chip warn">Waiting for Matt</span>`
    : `<span class="chip">Opens at Pending – Ready to Merge</span>`;
  return `<div class="grid">
  <div class="col">
    <section class="card">
      <div class="card-h">${ico('i-merge')}<h3>Merge gate</h3>${status}</div>
      <div class="card-b stack">
        <p class="hint" style="margin:0">Before a charity account is created, this lead is checked against existing accounts. EIN is checked first. The address key is the fallback, so "Jensen Dr" and "Jensen Drive" count as the same place.</p>
        <div class="norm">
          <div class="box"><label>Address on the lead</label>${esc(L.line)}<br>${esc(L.city)}, TX ${esc(L.zip)}</div>
          <div class="arrow" aria-hidden="true">→</div>
          <div class="box mono"><label>Match key</label>${esc(L.key || '—')}</div>
        </div>
        <div class="norm">
          <div class="box"><label>EIN on the lead</label>${esc(L.ein || 'Not on file')}</div>
          <div class="arrow" aria-hidden="true">→</div>
          <div class="box mono"><label>Normalised EIN</label>${esc(L.einN || '—')}</div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-h">${ico('i-org')}<h3>Charity accounts that match</h3></div>
      <div class="card-b stack">
        ${accs.length ? accs.map(m => `<div class="match strong"><div class="match-h"><b>${esc(m.A.name)}</b><span class="chip ok">${esc(m.reason)}</span></div>
          <span class="hint">Created in this preview from another lead.</span>
          ${canMerge ? `<div class="decision"><button class="btn primary" data-mergeinto="${m.A.id}">${ico('i-merge')}Link to this account</button></div>` : ''}</div>`).join('')
        : `<p class="hint" style="margin:0">No charity account matches. When this was read on Oct 2, Dynamics had no charity accounts. The 220 accounts there are individual clients.</p>`}
        ${canMerge && !accs.length ? `<div class="decision"><button class="btn primary" data-act="mergeNew">${ico('i-merge')}Create charity account: ${esc(L.org)}</button></div>` : ''}
        ${canMerge && accs.length ? `<div class="decision"><button class="btn" data-act="mergeNew">Create a separate account anyway</button></div>` : ''}
      </div>
    </section>
  </div>
  <div class="col">
    <section class="card">
      <div class="card-h">${ico('i-alert')}<h3>Other leads for the same charity</h3><span class="chip num">${leads.length}</span></div>
      <div class="card-b stack">
        ${leads.length ? leads.map(m => `<div class="match ${m.strength}"><div class="match-h"><b>${esc(m.O.ev)}</b><span class="chip ${m.strength === 'strong' ? 'ok' : 'warn'}">${esc(m.reason)}</span></div>
          <span class="hint">${esc(m.O.org)} · event ${fmt(m.O.evd)} · mail by ${fmt(m.O.mby)}</span>
          <span class="mono">${esc(m.O.key)}</span>
          <div class="decision"><button class="btn sm" data-goto="${m.O.id}">Open lead</button></div></div>`).join('')
        : `<p class="hint" style="margin:0">No other lead in the queue shares this EIN, address or name.</p>`}
      </div>
    </section>
    <section class="card">
      <div class="card-h">${ico('i-check')}<h3>How the key is built</h3></div>
      <div class="card-b"><ul class="hint" style="margin:0;padding-left:18px;display:grid;gap:4px">
        <li>Uppercase. Remove punctuation, so W.W. becomes WW.</li>
        <li>Drop suite and unit details: Suite 100-300, Ste C, #1360.</li>
        <li>Use standard abbreviations: Drive DR, Road RD, Street ST, Boulevard BLVD, Parkway PKWY, Lane LN, East E, Third 3RD.</li>
        <li>P.O. Box and Post Office Box become PO BOX.</li>
        <li>Add the 5-digit ZIP, or the city when the ZIP is missing.</li>
      </ul></div>
    </section>
  </div></div>`;
}

function packageTab(L) {
  const s = st(L.id), si = stageIdx(s.stage);
  const certStatus = si >= 5 ? 'Sent with package' : si >= 4 ? 'Created' : 'Not yet issued';
  const certChip = si >= 5 ? 'ok' : si >= 4 ? 'info' : '';
  const ladder = [
    ['Mailed', si >= 5, `Target ${fmt(L.mby)}`],
    ['Delivered', false, 'Confirm with the charity'],
    ['Event held', false, fmt(L.evd)],
    ['Results requested', false, 'Up to 3 purchaser request e-mails'],
    ['Purchasers recorded', false, 'Each purchaser becomes a prospect contact'],
  ];
  return `<div class="grid">
  <div class="col">
    <section class="card">
      <div class="card-h">${ico('i-gift')}<h3>Gift certificates</h3><span class="chip ${certChip}">${certStatus}</span></div>
      <div class="card-b tbl-wrap"><table>
        <thead><tr><th>Slot</th><th>Status</th><th>Purchaser</th></tr></thead>
        <tbody>${[['Red','#c8372d'],['Green','#2c8a55'],['Blue','#264BA7']].map(([n, c]) => `<tr><td><span class="slot"><i style="background:${c}"></i>${n}</span></td><td>${certStatus}</td><td class="hint">Recorded after the event</td></tr>`).join('')}</tbody>
      </table>
      <p class="hint" style="margin:10px 0 0">Certificates are created when the package is assembled and sealed${s.assembledOn ? `. Assembled ${esc(s.assembledOn)}.` : '.'}</p></div>
    </section>
    <section class="card">
      <div class="card-h">${ico('i-box')}<h3>Mailing label</h3><button class="btn sm" data-copy="label">${ico('i-copy')}Copy</button></div>
      <div class="card-b stack">
        <div class="label-card" style="font-size:14px">${esc(labelText(L))}</div>
        ${/\bP\.?\s*O\.?\s*BOX\b/i.test(L.line) ? `<span class="chip warn" style="justify-self:start">PO Box: ship by USPS</span>` : ''}
      </div>
    </section>
  </div>
  <div class="col">
    <section class="card">
      <div class="card-h">${ico('i-send')}<h3>GCP event follow-up</h3><span class="chip">${si >= 5 ? 'Open' : 'Starts when mailed'}</span></div>
      <div class="card-b"><ul class="ladder">
        ${ladder.map(([n, on, d]) => `<li class="${on ? 'on' : ''}"><span class="ring"></span><div><b style="font-weight:500">${n}</b><div class="hint">${esc(d)}</div></div><span class="chip ${on ? 'ok' : ''}">${on ? 'Done' : 'Not started'}</span></li>`).join('')}
      </ul>
      <p class="hint" style="margin:10px 0 0">Closed Won needs at least one purchaser recorded as a prospect. Closed Lost is split: certificates unsold, or sold with no purchaser identified.</p></div>
    </section>
  </div></div>`;
}

function render() { renderQueue(); renderRecord(); }

// ---------- events ----------
document.getElementById('q-list').addEventListener('click', e => { const li = e.target.closest('.q-item'); if (li) { S.sel = li.dataset.id; save(); render(); document.getElementById('record').scrollIntoView({block:'start'}); } });
document.getElementById('q-list').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { const li = e.target.closest('.q-item'); if (li) { e.preventDefault(); S.sel = li.dataset.id; save(); render(); } } });
document.getElementById('q-filter').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S.filter = b.dataset.f; save(); renderQueue(); } });
document.getElementById('q-search').addEventListener('input', e => { S.q = e.target.value; renderQueue(); });

document.getElementById('record').addEventListener('click', e => {
  const L = LEADS.find(x => x.id === S.sel), t = e.target.closest('button, a');
  if (!t) return;
  const d = t.dataset;
  if (d.act) return run(d.act);
  if (d.reject) { document.getElementById('reject-menu')?.setAttribute('hidden', ''); return run('reject', d.reject); }
  if (d.mergeinto) return run('mergeInto', d.mergeinto);
  if (d.tab) { S.tab = d.tab; save(); return renderRecord(); }
  if (d.goto) { S.sel = d.goto; save(); return render(); }
  if (d.copy === 'label') return copy(labelText(L), 'Mailing label');
  if (d.copytext) return copy(d.copytext, d.what);
  if (d.done) { snapshot(); const s = st(L.id); s.done[d.done] = !s.done[d.done]; save(); return render(); }
  if (d.focus === 'review') { document.getElementById('review-card').scrollIntoView({behavior:'smooth', block:'center'}); return document.getElementById('outcome').focus(); }
  if (t.id === 'reject-btn') { const m = document.getElementById('reject-menu'); const open = m.hasAttribute('hidden'); m.toggleAttribute('hidden', !open); t.setAttribute('aria-expanded', String(open)); return; }
  if (t.id === 'undo-cmd') return doUndo();
});
document.getElementById('record').addEventListener('change', e => {
  if (e.target.id === 'outcome') {
    const v = e.target.value;
    if (v === '714000020') return run('approve');
    if (v) return run('reject', v);
    return run('reopen');
  }
});
document.getElementById('record').addEventListener('input', e => {
  if (e.target.id === 'notes') { st(S.sel).notes = e.target.value; save(); }
});
document.addEventListener('click', e => { if (!e.target.closest('.menu-wrap')) document.getElementById('reject-menu')?.setAttribute('hidden', ''); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('reject-menu')?.setAttribute('hidden', ''); });

document.getElementById('q-search').value = S.q;
render();
</script>
